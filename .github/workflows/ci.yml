# Checks every push and pull request against Postgres.
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: scratch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scratch"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      COMPASS_BENCH_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/scratch
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: make check
      - run: make schema-check
