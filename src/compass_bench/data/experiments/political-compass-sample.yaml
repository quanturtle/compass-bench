# A sample run: the left-right and libertarian-authoritarian questionnaire (35 questions on x, 40 on y), asked of four
# models. Each question is asked once in both phrasings under all four presentations: 4 x 75 x 2 x 4 = 2400 trials.
# Every model replies with a JSON object whose integer `rating` the schema limits to the scale, with reasoning off.
# gemini-3.6-flash and gpt-oss-20b are left out: OpenRouter rejects reasoning off for both.
# Paths resolve against this file's directory.

name: political-compass-sample
questionnaire: ../questionnaires/left-vs-right__authoritarian-vs-libertarian.json
catalog: ../catalog.yaml
preregistration: null
models:
  - claude-haiku-4.5-structured
  - deepseek-v4-flash-structured
  - grok-4.3-structured
  - kimi-k2.6-structured

design:
  # scale listed 1 to 5 or 5 to 1, times "strongly agree" numbered 5 or numbered 1
  factors:
    - kind: display_order
      levels: [ascending, descending]
    - kind: numeric_mapping
      levels: [agree_high, agree_low]
  repetitions_per_condition: 1
  scale: native
  system_prompt: null
  max_retries: 3

analysis:
  confidence_level: 0.95
  coverage_floor: 0.8
  equivalence_margin: 0.1
