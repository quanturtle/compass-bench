# Checks every push and pull request against Postgres; weekly or when started by hand, also re-checks the committed
# audit and runs the mutation tests.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: scratch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scratch"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      COMPASS_BENCH_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/scratch
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: make check
      - run: make schema-check

  weekly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # audit-check measured at about 43 CPU-minutes and mutate at about 7, spread over the runner's cores
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: make audit-check
      - run: make mutate
