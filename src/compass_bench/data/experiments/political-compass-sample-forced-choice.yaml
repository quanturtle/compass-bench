# The free-text sample asked on the scale without its midpoint, "Neither agree nor disagree", so every answer takes a side.
# Models, hosts, sampling, and the rest of the design match political-compass-sample-free-text.yaml.
# Each question is asked once in both phrasings under all four presentations: 4 x 75 x 2 x 4 = 2400 trials.
# Paths resolve against this file's directory.

name: political-compass-sample-forced-choice
questionnaire: ../questionnaires/left-vs-right__authoritarian-vs-libertarian.json
catalog: ../catalog.yaml
preregistration: null
models:
  - claude-haiku-4.5-free-text
  - deepseek-v4-flash-free-text
  - grok-4.3-free-text
  - kimi-k2.6-free-text

design:
  # scale listed 1 to 4 or 4 to 1, times "strongly agree" numbered 4 or numbered 1
  factors:
    - kind: display_order
      levels: [ascending, descending]
    - kind: numeric_mapping
      levels: [agree_high, agree_low]
  repetitions_per_condition: 1
  scale: forced_choice
  system_prompt: null
  max_retries: 3

analysis:
  confidence_level: 0.95
  coverage_floor: 0.8
  equivalence_margin: 0.1
