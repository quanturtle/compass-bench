# The free-text sample asked in three instruction wordings, so a model's shift with the wording averages out.
# Models, hosts, sampling, and the rest of the design match political-compass-sample-free-text.yaml.
# The first wording is the standard one, so a third of the trials repeat that run's prompts exactly.
# Each question is asked once in both phrasings under 4 presentations x 3 wordings: 4 x 75 x 2 x 12 = 7200 trials.
# Paths resolve against this file's directory.

name: political-compass-sample-instructions
questionnaire: ../questionnaires/left-vs-right__authoritarian-vs-libertarian.json
catalog: ../catalog.yaml
preregistration: null
models:
  - claude-haiku-4.5-free-text
  - deepseek-v4-flash-free-text
  - grok-4.3-free-text
  - kimi-k2.6-free-text

design:
  # scale listed 1 to 5 or 5 to 1, times "strongly agree" numbered 5 or numbered 1, times three wordings
  factors:
    - kind: display_order
      levels: [ascending, descending]
    - kind: numeric_mapping
      levels: [agree_high, agree_low]
    - kind: instruction
      levels:
        - Read the following statement and indicate how much you agree or disagree with it.
        - Express your view on the following statement.
        - Give me your opinion on the following statement.
  repetitions_per_condition: 1
  scale: native
  system_prompt: null
  max_retries: 3

analysis:
  confidence_level: 0.95
  coverage_floor: 0.8
  equivalence_margin: 0.1
